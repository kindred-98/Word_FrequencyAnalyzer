name: Linting y Análisis de Código

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
        pip install --only-binary :all: -r requirements.txt
        pip install --only-binary :all: black==26.10.0 isort==9.0.2 flake8==7.4.1 mypy==2.4.0 pylint==4.1.2

    - name: Check code formatting with black
      run: black --check src/ test/
      continue-on-error: true

    - name: Check import order with isort
      run: isort --check-only src/ test/
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 src/ test/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ test/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Type checking with mypy
      run: mypy src/text_analyzer --ignore-missing-imports --no-error-summary
      continue-on-error: true

    - name: Security check with bandit
      run: |
        pip install --only-binary :all: bandit==1.9.4
        bandit -r src/ --skip B101 -f json -o bandit-report.json
      continue-on-error: true
