name: Tests y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.3.3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: "pip==26.2.1"
        pip install --only-binary :all: -r requirements.txt
        pip install --only-binary :all: pytest-cov==7.1.0 codecov==2.1.13

    - name: Run tests with coverage
      run: |
        pytest --cov=src/text_analyzer --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('./coverage.xml', 'utf8');
          const testResults = `
          ✅ Tests completados para Python ${{ matrix.python-version }}
          
          | Métrica | Estado |
          |---------|--------|
          | Python | ${{ matrix.python-version }} |
          | Runner | ${{ runner.os }} |
          
          Los reportes de cobertura se enviarán a Codecov.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: testResults
          });
